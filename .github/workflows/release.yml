name: release

# Push a tag like v0.1.0 to build the binaries, sign the checksums and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # keyless cosign signing with this workflow's identity

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          # pinned so anyone can rebuild a byte-identical binary (see README, offline host setup)
          go-version: "1.27.3"
      - name: Tag matches the version in main.go
        run: test "$(go run . version)" = "${GITHUB_REF_NAME#v}"
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false -o "dist/airlock_${os}_${arch}" .
          done
          cd dist && sha256sum airlock_* > checksums.txt && cat checksums.txt
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
