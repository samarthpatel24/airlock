# Ghostty settings used only for the demo recording: solid background,
# Matrix-style green text, and a normal palette so red, yellow and cyan read clearly.
# Size and position are passed per scene by record-mac.sh.
window-padding-x = 22
window-padding-y = 16
macos-titlebar-style = transparent
title = airlock
cursor-style = block
cursor-style-blink = false
confirm-close-surface = false

background = #0a0e0a
foreground = #c8f7c5
background-opacity = 1
cursor-color = #5af78e
selection-background = #1f3a24
palette = 0=#0a0e0a
palette = 1=#ff5f5f
palette = 2=#5af78e
palette = 3=#f3f99d
palette = 4=#57c7ff
palette = 5=#ff6ac1
palette = 6=#9aedfe
palette = 7=#e6e6e6
palette = 8=#8a9a8a
palette = 9=#ff7b7b
palette = 10=#7dffa6
palette = 11=#ffff8f
palette = 12=#7fd4ff
palette = 13=#ff8fd6
palette = 14=#b5f4ff
palette = 15=#ffffff
